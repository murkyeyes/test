name: hkchat-local

services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "if [ ! -f /data/hkchat.sqlite ] && [ -f /seed/hkchat.sqlite ]; then cp /seed/hkchat.sqlite /data/hkchat.sqlite; fi; exec node server.mjs"]
    environment:
      HKCHAT_DB: /data/hkchat.sqlite
      HKCHAT_PORT: "8070"
    ports:
      - "${HKCHAT_BIND:-127.0.0.1}:8070:8070"
    volumes:
      - ./server:/app:ro
      - ./backup:/seed:ro
      - hkchat_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8070/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  hkchat_data:
